<head>

  <meta name="theme-color" content="#1a1814" />

  <link rel="stylesheet" href="/yard-theme.css?v=20260729-deep-qa" />
  <script src="/js/theme-preview.js?v=20260816-taste2"></script>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("wa_lang");
        var lang = saved === "ko" || saved === "en" ? saved : null;
        if (!lang) {
          var q = new URLSearchParams(location.search || "").get("lang");
          if (q === "ko" || q === "en") lang = q;
        }
        if (!lang) {
          var nav = String(navigator.language || "").toLowerCase();
          lang = nav.indexOf("ko") === 0 ? "ko" : "en";
        }
        document.documentElement.lang = lang;
        document.documentElement.setAttribute("data-wa-lang", lang);
      } catch (e) {}
    })();
  </script>
</head>

  <main class="form-page" style="text-align:center">
    <p class="eyebrow" data-i18n="page404.eyebrow">404</p>
