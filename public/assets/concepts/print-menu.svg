<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550"><rect width="800" height="550" fill="#c6c0b5"/><g font-family="Pretendard, Malgun Gothic, sans-serif"><text x="32" y="35" font-size="12" font-weight="500" fill="#69736e">FOLDED MENU / THREE PANELS</text><rect x="103" y="105" width="198" height="346" rx="0" fill="#e3cd9e"/><rect x="301" y="105" width="198" height="346" rx="0" fill="#fff7e5"/><rect x="499" y="105" width="198" height="346" rx="0" fill="#f0e4c9"/><text x="126" y="161" font-size="42" font-weight="700" fill="#79513a">온담</text><text x="127" y="193" font-size="14" font-weight="500" fill="#79513a">계절을 담은 식탁</text><circle cx="201" cy="312" r="66" fill="#a0aa79"/><circle cx="201" cy="312" r="49" fill="#ede5c9"/><text x="320" y="157" font-size="18" font-weight="500" fill="#263632">정갈한 한 상</text><text x="320" y="181" font-size="11" font-weight="500" fill="#263632">계절 채소와 따뜻한 국</text><text x="320" y="244" font-size="18" font-weight="500" fill="#263632">함께 나누는 음식</text><text x="320" y="268" font-size="11" font-weight="500" fill="#263632">두 사람을 위한 구성</text><text x="320" y="331" font-size="18" font-weight="500" fill="#263632">차와 작은 후식</text><text x="320" y="355" font-size="11" font-weight="500" fill="#263632">식사를 마무리하는 시간</text><text x="518" y="159" font-size="21" font-weight="500" fill="#263632">오늘의 재료</text><text x="518" y="196" font-size="12" font-weight="500" fill="#263632">들깨 · 버섯 · 뿌리채소</text><path d="M540 354Q560 226 616 237Q641 290 540 354" fill="#84976c"/><path d="M540 372L610 259" stroke="#506543" stroke-width="3" fill="none"/></g></svg>