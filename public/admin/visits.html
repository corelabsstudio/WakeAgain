<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>방문자 유입경로 · WakeAgain 관리자</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  body {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .admin-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-top: 20px;
  }
  .admin-title {
    font-size: var(--text-lg, 1.0625rem);
    font-weight: 700;
    margin: 0 0 4px;
  }
  .admin-sub {
    color: var(--text-muted, #b8ae9b);
    font-size: var(--text-sm, 0.875rem);
    margin: 0 0 20px;
  }
  .admin-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .admin-row input[type="password"],
  .admin-row input[type="date"] {
    flex: 1;
    min-width: 160px;
    background: var(--bg, #1a1814);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: var(--text-sm, 0.875rem);
  }
  .admin-row button {
    background: var(--accent, #d4a017);
    color: #1a1814;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 700;
    font-size: var(--text-sm, 0.875rem);
    cursor: pointer;
  }
  .admin-row button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .admin-error {
    color: #e06a5a;
    font-size: var(--text-sm, 0.875rem);
    margin: 4px 0 0;
    display: none;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: var(--bg, #1a1814);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-box .n {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent, #d4a017);
  }
  .stat-box .l {
    font-size: var(--text-xs, 0.8125rem);
    color: var(--text-muted, #b8ae9b);
  }
  table.src-table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-sm, 0.875rem);
  }
  table.src-table th,
  table.src-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.src-table th {
    color: var(--text-muted, #b8ae9b);
    font-weight: 600;
    font-size: var(--text-xs, 0.8125rem);
  }
  .bar-track {
    background: var(--border);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar-fill {
    background: var(--accent, #d4a017);
    height: 100%;
  }
  .empty {
    color: var(--text-muted, #b8ae9b);
    font-size: var(--text-sm, 0.875rem);
    padding: 12px 0;
  }
  #gateBox.hidden,
  #dataBox.hidden {
    display: none;
  }
</style>
</head>
<body>
  <p class="admin-sub" style="margin-bottom:0"><a href="/" class="text-link">← WakeAgain</a></p>
  <h1 class="admin-title">방문자 유입경로</h1>
  <p class="admin-sub">관리자 전용 · 선택한 날짜(KST)에 처음 들어온 방문자가 어느 경로로 왔는지 보여줍니다.</p>

  <div id="gateBox" class="admin-card">
    <div class="admin-row">
      <input type="password" id="adminKeyInput" placeholder="관리자 키 (X-Admin-Key)" autocomplete="off" />
      <button id="unlockBtn">보기</button>
    </div>
    <p id="gateError" class="admin-error"></p>
  </div>

  <div id="dataBox" class="admin-card hidden">
    <div class="admin-row">
      <input type="date" id="dayInput" />
      <button id="reloadBtn">조회</button>
      <button id="lockBtn" class="secondary">키 잊기</button>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="n" id="statToday">—</div><div class="l">오늘 방문자</div></div>
      <div class="stat-box"><div class="n" id="statPageviews">—</div><div class="l">오늘 페이지뷰</div></div>
      <div class="stat-box"><div class="n" id="statTotal">—</div><div class="l">전체 누적 방문자</div></div>
    </div>

    <table class="src-table" id="srcTable" style="display:none">
      <thead><tr><th>경로</th><th>방문</th><th>비율</th></tr></thead>
      <tbody id="srcTableBody"></tbody>
    </table>
    <p class="empty" id="srcEmpty" style="display:none">해당 날짜엔 기록된 방문이 없습니다.</p>
  </div>

<script>
(function () {
  var KEY_STORAGE = "wa_admin_key";
  var gateBox = document.getElementById("gateBox");
  var dataBox = document.getElementById("dataBox");
  var gateError = document.getElementById("gateError");
  var adminKeyInput = document.getElementById("adminKeyInput");
  var dayInput = document.getElementById("dayInput");

  function apiBase() {
    if (window.WakeAgainAPI && typeof window.WakeAgainAPI.apiBase === "function") {
      return window.WakeAgainAPI.apiBase();
    }
    return "";
  }

  function getKey() {
    try {
      return localStorage.getItem(KEY_STORAGE) || "";
    } catch (e) {
      return "";
    }
  }

  function setKey(k) {
    try {
      localStorage.setItem(KEY_STORAGE, k);
    } catch (e) {}
  }

  function clearKey() {
    try {
      localStorage.removeItem(KEY_STORAGE);
    } catch (e) {}
  }

  function showGate(message) {
    dataBox.classList.add("hidden");
    gateBox.classList.remove("hidden");
    if (message) {
      gateError.textContent = message;
      gateError.style.display = "block";
    } else {
      gateError.style.display = "none";
    }
  }

  function renderStats(stats) {
    document.getElementById("statToday").textContent = Number(stats.today_visitors || 0).toLocaleString();
    document.getElementById("statPageviews").textContent = Number(stats.today_page_views || 0).toLocaleString();
    document.getElementById("statTotal").textContent = Number(stats.visitors || 0).toLocaleString();
  }

  function renderSources(data) {
    var sources = (data && data.sources) || [];
    var table = document.getElementById("srcTable");
    var body = document.getElementById("srcTableBody");
    var empty = document.getElementById("srcEmpty");
    body.innerHTML = "";

    if (!sources.length) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    table.style.display = "table";

    var total = sources.reduce(function (sum, s) { return sum + (s.visits || 0); }, 0);
    sources.forEach(function (s) {
      var pct = total ? Math.round((s.visits / total) * 100) : 0;
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + s.source + "</td>" +
        "<td>" + s.visits + "</td>" +
        '<td style="min-width:120px">' + pct + "%" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></td>';
      body.appendChild(tr);
    });
  }

  function load(key) {
    var day = dayInput.value || "";
    var url = apiBase() + "/api/v1/admin/visit-sources" + (day ? "?day=" + encodeURIComponent(day) : "");

    Promise.all([
      fetch(apiBase() + "/api/v1/visit", { credentials: "same-origin" }).then(function (r) { return r.json(); }),
      fetch(url, { headers: { "X-Admin-Key": key }, credentials: "same-origin" }),
    ]).then(function (results) {
      var statsResp = results[0];
      var srcRes = results[1];
      if (srcRes.status === 401) {
        clearKey();
        showGate("관리자 키가 올바르지 않습니다.");
        return;
      }
      return srcRes.json().then(function (srcData) {
        gateBox.classList.add("hidden");
        dataBox.classList.remove("hidden");
        renderStats(statsResp);
        renderSources(srcData);
        if (!dayInput.value && srcData.day) dayInput.value = srcData.day;
      });
    }).catch(function () {
      showGate("불러오기 실패 — 네트워크를 확인해 주세요.");
    });
  }

  document.getElementById("unlockBtn").addEventListener("click", function () {
    var k = adminKeyInput.value.trim();
    if (!k) return;
    setKey(k);
    load(k);
  });

  adminKeyInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("unlockBtn").click();
  });

  document.getElementById("reloadBtn").addEventListener("click", function () {
    load(getKey());
  });

  document.getElementById("lockBtn").addEventListener("click", function () {
    clearKey();
    adminKeyInput.value = "";
    showGate();
  });

  var savedKey = getKey();
  if (savedKey) {
    load(savedKey);
  }
})();
</script>
</body>
</html>
