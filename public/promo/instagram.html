<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>인스타 인증 → 통합 이벤트 — WakeAgain</title>
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0;url=/promo/event.html?channel=instagram" />
  <link rel="canonical" href="/promo/event.html?channel=instagram" />
  <script>
    location.replace("/promo/event.html?channel=instagram");
  </script>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("wa_lang");
        var lang = saved === "ko" || saved === "en" ? saved : null;
        if (!lang) {
          var q = new URLSearchParams(location.search || "").get("lang");
          if (q === "ko" || q === "en") lang = q;
        }
        if (!lang) {
          var nav = String(navigator.language || "").toLowerCase();
          lang = nav.indexOf("ko") === 0 ? "ko" : "en";
        }
        document.documentElement.lang = lang;
        document.documentElement.setAttribute("data-wa-lang", lang);
      } catch (e) {}
    })();
  </script>
  <script src="/js/theme-preview.js?v=20260816-ch1"></script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem;color:#ccc;background:#050508">
    인스타 인증은 통합 이벤트로 합쳐졌습니다.
    <a href="/promo/event.html?channel=instagram" style="color:#d4a86a">이벤트 페이지로 이동</a>
  </p>
</body>
</html>
