<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#000000" />
  <title>no signal</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: #000;
      color: #5a5a5a;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #8a8a8a;
      line-height: 1.7;
    }
    .sub {
      margin: 1.25rem 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: #3a3a3a;
      max-width: 22rem;
      line-height: 1.55;
    }
    .code {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #2a2a2a;
      letter-spacing: 0.12em;
    }
    a.back {
      margin-top: 2.5rem;
      color: #333;
      font-size: 0.72rem;
      text-decoration: none;
      border-bottom: 1px solid #222;
    }
    a.back:hover { color: #666; }
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: #444;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>
      wakeagain...<br />
      no signal...<span class="cursor" aria-hidden="true"></span>
    </h1>
    <p class="sub">
      이 신호는 아직 응답하지 않습니다.<br />
      connection refused · process waiting
    </p>
    <p class="code">REFUSED · WA-DEAD · retry later</p>
    <a class="back" href="./">← 기록으로</a>
  </div>
  <script>
    document.title = "no signal";
  </script>
</body>
</html>
